# Install cilium via helm
# helm repo add cilium https://helm.cilium.io/
# helm upgrade --install cilium cilium/cilium --version 1.19.1 \
#    --namespace kube-system \
#    --reuse-values \
#    --set kubeProxyReplacement=true \
#    --set k8sServiceHost=192.168.178.37 \
#    --set k8sServicePort=6443 \
#    --set gatewayAPI.enabled=true \
#    --set l2announcements.enabled=true
# # Remove kube-proxy
# kubectl -n kube-system delete ds kube-proxy
# kubectl -n kube-system delete cm kube-proxy
# # Re-rollout
# kubectl -n kube-system rollout restart deployment/cilium-operator
# kubectl -n kube-system rollout restart ds/cilium
#
#
# Cilium L2 Announcement/ Advertisement
#
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-ip-pool
spec:
  blocks:
    - cidr: 192.168.178.250/32
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: announce-lb-services
spec:
  interfaces:
    - ens2
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra-ns
  labels:
    shared-gateway-access: "true"
---
#
# https://gateway-api.sigs.k8s.io/guides/getting-started/#installing-gateway-api
# https://gateway-api.sigs.k8s.io/guides/multiple-ns/#cross-namespace-routing
#
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: infra-ns
spec:
  addresses:
  - type: IPAddress
    value: 192.168.178.250
  gatewayClassName: cilium
  listeners:
  # Only allow in routes in same namespace
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            shared-gateway-access: "true"