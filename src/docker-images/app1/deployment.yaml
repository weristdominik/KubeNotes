apiVersion: v1
kind: Namespace
metadata:
  name: app1-ns
  labels:
    shared-gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app1
  namespace: app1-ns
spec:
  parentRefs:
  - name: shared-gateway
    namespace: infra-ns
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /app1
    backendRefs:
    - name: app1
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: app1-ns
spec:
  type: ClusterIP
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
  namespace: app1-ns
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        image: ghcr.io/weristdominik/kubenotes/app1@sha256:cd84a5c0069988720cbb0099504568f8e5e21e13fb1f9146890b78688aada2d0
        imagePullPolicy: IfNotPresent
        env:
          - name: PREFIX
            value: "app1"
          - name: PORT
            value: "5000"
          - name: KEYCLOAK_SERVER
            value: "http://192.168.178.250/auth/"
          - name: CLIENT_ID
            value: "app1"
          - name: CLIENT_SECRET
            value: "TYAOIfWpPjZabKPn4FAVsxSpskT0Wj2C"
          - name: REDIRECT_URI
            value: "http://192.168.178.250/app1/callback"
          - name: MY_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
   