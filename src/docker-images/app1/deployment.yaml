apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-py-client-route
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /app1
    # filters:
    # - type: URLRewrite
    #   urlRewrite:
    #     path:
    #       type: ReplacePrefixMatch
    #       replacePrefixMatch: /
    backendRefs:
    - name: auth-py-client
      port: 80